name: Build MagicBox mitm APK

# 只手动触发，避免每次 push 都消耗 Actions 额度
on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'CPU 架构'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x86_64
          - both

jobs:
  build:
    name: Build APK (${{ inputs.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 校验内置 addon 存在
        run: |
          test -f app/src/main/python/magicbox_member.py \
            || { echo "::error::magicbox_member.py 不存在"; exit 1; }
          grep -q "from magicbox_member import MagicBoxMember" app/src/main/python/mitm.py \
            || { echo "::error::mitm.py 未注入 MagicBoxMember"; exit 1; }
          echo "内置 addon 检查通过"

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 需要构建机上存在同版本 Python
      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 设置 Gradle（带缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 生成签名 keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore \
            -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MagicBoxMitm, OU=Dev, O=MagicBox, L=Beijing, ST=Beijing, C=CN"
          ls -la keystore

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 arm64
        if: ${{ inputs.abi == 'arm64' || inputs.abi == 'both' }}
        run: |
          set -o pipefail
          # flavor 名为 arm64，task 为 assembleArm64Release
          ./gradlew assembleArm64Release --stacktrace \
            || ./gradlew assembleRelease --stacktrace

      - name: 编译 x86_64
        if: ${{ inputs.abi == 'x86_64' || inputs.abi == 'both' }}
        run: |
          set -o pipefail
          # flavor 名含下划线，task 名可能是 assembleX86_64Release
          # 失败则回退到 assembleRelease（会同时产出两个架构）
          ./gradlew assembleX86_64Release --stacktrace \
            || ./gradlew assembleRelease --stacktrace

      - name: 检查 16KB 对齐
        run: |
          chmod +x .github/check_16kb_alignment.sh || true
          APKS=$(find app/build/outputs/apk -name '*.apk' | tr '\n' ' ')
          echo "产物: $APKS"
          if [ -n "$APKS" ]; then
            .github/check_16kb_alignment.sh $APKS || echo "::warning::16KB 对齐检查未通过（不影响安装）"
          fi

      - name: 校验签名
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          echo "build-tools: $BT"
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            echo "--- $f"
            "$BT/apksigner" verify --print-certs "$f" | head -5
          done

      - name: 列出产物
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicBox-mitm-${{ inputs.abi }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
